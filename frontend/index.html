<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf8" />
    <title>DOSTATOK | Personal finance</title>
    <script>
      try {
        const theme = localStorage.getItem('dostatok-theme');
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch { /* Storage may be disabled; the app falls back to light mode. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
